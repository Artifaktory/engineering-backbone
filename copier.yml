_min_copier_version: "9.11.3"
_subdirectory: templates
_answers_file: .engineering-backbone/copier-answers.yml
_external_data:
  installed_answers: "{{ _copier_conf.answers_file }}"
_exclude:
  - _partials
_skip_if_exists:
  - AGENTS.md
  - "**/AGENTS.md"
  - .github/copilot-instructions.md
  - ".codex/agents/**"
  - ".github/agents/**"
  - ".github/skills/**"
  - ".github/instructions/**"
  - .github/workflows/engineering-backbone.yml
  - .github/workflows/backbone-pr-checks.yml
  - .github/workflows/backbone-maintenance.yml
  - .github/workflows/backbone-release.yml
  - .github/workflows/backbone-deploy.yml
  - .engineering-backbone/project.json
  - .engineering-backbone/workflows.json
  - .engineering-backbone/quality-profile.json
  - .engineering-backbone/navigation.json
  - docs/quality/quality-plan.md
  - docs/quality/test-strategy.md
  - docs/quality/traceability.csv
  - docs/quality/exceptions.md
  - ".engineering-backbone/workflow-examples/**"

project_name:
  type: str
  default: project
  help: Repository name (letters, digits, dot, underscore or hyphen).
  validator: >-
    {% if not (project_name | regex_search('^[A-Za-z][A-Za-z0-9._-]{0,79}$')) %}
    Use a repository name of 1 to 80 characters, beginning with a letter.
    {% endif %}
base_branch:
  type: str
  default: main
  help: Target branch for reviewed pull requests.
  validator: >-
    {% if not (base_branch | regex_search('^[A-Za-z0-9][A-Za-z0-9._/-]{0,119}\\Z')) or base_branch == 'HEAD' or '..' in base_branch or '//' in base_branch or '/.' in base_branch or base_branch.endswith('/') or base_branch.endswith('.') or (base_branch | regex_search('\\.lock(?:/|$)')) %}
    Use a valid single-line Git branch name without dot-prefixed, .lock or empty components.
    {% endif %}
validation_command:
  type: str
  default: python -m unittest discover -s tests -v
  help: Existing local validation command; recorded as metadata, never executed by Copier.
  validator: >-
    {% if not validation_command.strip() or not (validation_command | regex_search('^[^\x00-\x1f\x7f]{1,500}$')) %}
    Provide a nonempty single-line command of at most 500 characters without control characters.
    {% endif %}
language:
  type: str
  default: unspecified
  help: Language or language combination; descriptive metadata only.
  validator: >-
    {% if not language.strip() or not (language | regex_search('^[^\x00-\x1f\x7f]{1,120}$')) %}
    Provide single-line language metadata of at most 120 characters without control characters.
    {% endif %}
has_frontend:
  type: bool
  default: false
  help: Record whether the project has a frontend; does not create application workflows.
has_backend:
  type: bool
  default: false
  help: Record whether the project has a backend; does not create application workflows.
use_codex:
  type: bool
  default: true
  help: Add Codex instructions and three native role profiles if their files do not exist.
  validator: >-
    {% set previous = _external_data.installed_answers %}
    {% if previous and ('use_codex' not in previous or use_codex != previous.use_codex) %}
    use_codex is installation-only; use a separate reviewed adapter migration and reconcile project facts and answers.
    {% endif %}
use_copilot:
  type: bool
  default: true
  help: Add Copilot instructions, ten native roles, eight skills and selected path rules when absent.
  validator: >-
    {% set previous = _external_data.installed_answers %}
    {% if previous and ('use_copilot' not in previous or use_copilot != previous.use_copilot) %}
    use_copilot is installation-only; use a separate reviewed adapter migration and reconcile project facts and answers.
    {% endif %}
copilot_python_profile:
  type: bool
  default: false
  help: Add optional Python path instructions; no runtime or test command is installed.
  validator: >-
    {% set previous = _external_data.installed_answers %}
    {% if previous and copilot_python_profile != previous.get('copilot_python_profile', false) %}
    copilot_python_profile is installation-only; legacy answers mean false. Use a separate reviewed profile migration.
    {% endif %}
copilot_frontend_profile:
  type: bool
  default: false
  help: Add optional frontend path instructions; framework and paths remain project-owned.
  validator: >-
    {% set previous = _external_data.installed_answers %}
    {% if previous and copilot_frontend_profile != previous.get('copilot_frontend_profile', false) %}
    copilot_frontend_profile is installation-only; legacy answers mean false. Use a separate reviewed profile migration.
    {% endif %}

backbone_workflow_ref:
  type: str
  default: ""
  help: Optional reviewed 40-character commit SHA; blank leaves workflow activation manual.
  validator: >-
    {% if backbone_workflow_ref and not (backbone_workflow_ref | regex_search('^[0-9a-fA-F]{40}$')) %}
    Leave blank or provide a reviewed full 40-character Git commit SHA.
    {% endif %}
    {% set previous = _external_data.installed_answers %}
    {% if previous and ('backbone_workflow_ref' not in previous or backbone_workflow_ref | lower != previous.backbone_workflow_ref | lower) %}
    backbone_workflow_ref is installation-only; change workflow activation or its pin in a separate reviewed migration and reconcile answers.
    {% endif %}

use_workflow_kit:
  type: bool
  default: false
  help: Seed the optional shared workflow kit without application commands; activation needs a separate reviewed configuration PR.
  validator: >-
    {% set previous = _external_data.installed_answers %}
    {% if previous and use_workflow_kit != previous.get('use_workflow_kit', false) %}
    use_workflow_kit is installation-only; legacy answers mean false. Use a separate reviewed workflow-kit migration.
    {% endif %}

use_quality_framework:
  type: bool
  default: false
  help: Seed the optional versioned quality framework and project-owned documents; no rules or application checks are activated automatically.
  validator: >-
    {% set previous = _external_data.installed_answers %}
    {% if previous and use_quality_framework != previous.get('use_quality_framework', false) %}
    use_quality_framework is installation-only; legacy answers mean false. Use a separate reviewed quality-profile migration.
    {% endif %}

workflow_kit_ref:
  type: str
  default: ""
  help: Optional reviewed 40-character kit commit SHA; blank omits native callers. A pin alone cannot activate the inactive seed.
  validator: >-
    {% if workflow_kit_ref and not (workflow_kit_ref | regex_search('^[0-9a-fA-F]{40}\\Z')) %}
    Leave blank or provide a reviewed full 40-character Git commit SHA.
    {% endif %}
    {% if workflow_kit_ref and not use_workflow_kit %}
    workflow_kit_ref requires use_workflow_kit; choose the kit explicitly before providing a pin.
    {% endif %}
    {% set previous = _external_data.installed_answers %}
    {% if previous and workflow_kit_ref | lower != previous.get('workflow_kit_ref', '') | lower %}
    workflow_kit_ref is installation-only; legacy answers mean blank. Change the caller pin in a separate reviewed migration and reconcile answers.
    {% endif %}

_message_after_copy: >-
  Review .engineering-backbone/project.json and the generated instruction fragments.
  Existing native instructions, profiles, Copilot skills and path rules were preserved. Manually integrate the
  fragments into stronger local governance before claiming adoption.
  A selected workflow kit is an inactive seed: review its complete project configuration before a separate activation PR.
  A selected quality framework is also an inactive seed; review project rules, documents and check bindings before separate activation.
_message_after_update: >-
  Review the diff of .engineering-backbone/core.md, core.json and instruction fragments.
  Existing native instructions, profiles, skills, path rules and project facts were preserved;
  refresh them manually in the same reviewed update PR when needed.
  Existing workflow-kit configuration, callers and delivery examples were preserved.
  Existing quality profiles and project-owned quality documents were preserved. Managed catalog and guidance updates require reviewed integration with the matching workflow pin.
