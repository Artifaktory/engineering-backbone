name: Backbone quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backbone-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks
    uses: ./.github/workflows/governance-checks.yml
    with:
      source_mode: true

  source-dependencies:
    name: Source dependencies and container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify clean locked source environment and tracked inputs
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r .engineering-backbone/requirements.lock
          .venv/bin/python .engineering-backbone/src/check_source_dependencies.py
      - name: Build tracked tooling Dockerfile
        run: docker build --pull --tag backbone-tooling:check --file infra/docker/engineering-backbone/Dockerfile .
      - name: Run offline container validation and real Copier smoke
        run: |
          docker run --rm --network none backbone-tooling:check sh -eu -c '
            python -m pip check
            python .engineering-backbone/src/validate.py
            python .engineering-backbone/src/maintenance/compile_navigation.py --check
            python .engineering-backbone/src/maintenance/compile_quality_framework.py --check
            python .engineering-backbone/src/maintenance/compile_workflow_kit.py --check
            python .engineering-backbone/src/maintenance/compile_toolchain_fingerprint.py --check
            python -m unittest discover -s .engineering-backbone/tst -t .engineering-backbone -p test_copier.py -v
          '

  trusted-policy:
    name: Trusted base policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false
      - name: Checkout candidate snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check policy with base-owned validator
        run: |
          if [ -f trusted-base/.engineering-backbone/src/validate.py ]; then
            python -m pip install --require-hashes -r trusted-base/.engineering-backbone/requirements.lock
            python trusted-base/.engineering-backbone/src/validate.py --root candidate --trusted-base trusted-base
          elif [ -f trusted-base/scripts/validate.py ]; then
            # First layout migration: the old trusted validator still runs.
            # Its old-path incompatibility is a visible merge blocker, never a waiver.
            python -m pip install --require-hashes -r trusted-base/requirements.lock
            python trusted-base/scripts/validate.py --root candidate --trusted-base trusted-base
          else
            echo '::error::No trusted validator baseline; reviewed bootstrap is required.'
            exit 1
          fi
