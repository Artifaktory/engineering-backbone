name: Reusable governance checks

on:
  workflow_call:
    inputs:
      source_mode:
        description: Validate the backbone source rather than a generated consumer bundle
        type: boolean
        default: false
      python_version:
        description: Python version for the validation tooling
        type: string
        default: '3.12'

permissions:
  contents: read

jobs:
  validate:
    name: Validate governance and compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout caller snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python_version }}
      - name: Validate backbone source
        if: inputs.source_mode
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python scripts/validate.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Validate generated consumer bundle
        if: ${{ !inputs.source_mode }}
        run: |
          python -m pip install --require-hashes -r .engineering-backbone/requirements.lock
          python .engineering-backbone/validate.py --root .
          git diff --check
