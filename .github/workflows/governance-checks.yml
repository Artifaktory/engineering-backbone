name: Reusable governance checks

on:
  workflow_call:
    inputs:
      source_mode:
        description: Validate the backbone source rather than a generated consumer bundle
        type: boolean
        default: false
      python_version:
        description: Python version for the validation tooling
        type: string
        default: '3.12'

permissions:
  contents: read

jobs:
  validate:
    name: Validate governance and compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check workflow mode and event
        shell: bash
        env:
          SOURCE_MODE: ${{ inputs.source_mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_MODE" = 'true' ] && [ "$GITHUB_REPOSITORY" != 'Artifaktory/engineering-backbone' ]; then
            echo '::error::Source mode is restricted to the backbone source repository.'
            exit 1
          fi
          case "$EVENT_NAME" in
            pull_request|push|workflow_dispatch) ;;
            *) echo '::error::Unsupported event for governance validation.'; exit 1 ;;
          esac
      - name: Checkout candidate snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout trusted consumer snapshot
        if: ${{ !inputs.source_mode && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: trusted-base
          persist-credentials: false
      - name: Checkout trusted consumer default branch
        if: ${{ !inputs.source_mode && github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          path: trusted-base
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python_version }}
      - name: Validate backbone source
        if: inputs.source_mode
        working-directory: candidate
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python scripts/validate.py
          python scripts/compile_toolchain_fingerprint.py --check
          python -m unittest discover -s tests -v
      - name: Validate generated consumer with trusted tooling
        if: ${{ !inputs.source_mode }}
        shell: bash
        env:
          CURRENT_TOOLCHAIN_SHA256: '5bca19e704f2e6ca5744cfccb10e52b862dc7b9d4c18ed5f5cb3a6db8aadab4a'
          PREVIOUS_TOOLCHAIN_SHA256: '["444494997fb175e75e9fe5031d02e1005db910800711116773c890ea24508566","92a5da2f8cbc81f588e231167ae5b66e5f69e255f80be1d13c80ea4152b3dffa","ef266be0f22b7e505563e408fe8b93ab6418ec1255bed6c2d6067f9e74be44c9"]'
        run: |
          set -euo pipefail
          trusted_root="$GITHUB_WORKSPACE/trusted-base"
          candidate_root="$GITHUB_WORKSPACE/candidate"
          for required in validate.py requirements.txt requirements.lock core.json core.md \
            schemas/core-policy.schema.json schemas/project.schema.json \
            schemas/task-packet.schema.json schemas/review-evidence.schema.json \
            schemas/requirement.schema.json; do
            if [ ! -f "$trusted_root/.engineering-backbone/$required" ]; then
              echo '::error::No complete trusted consumer baseline. First seed a reviewed bundle with the workflow inactive; activate the pinned caller in a separate PR after that baseline is merged.'
              exit 1
            fi
          done
          # Fingerprints belong to this immutable workflow, never caller input.
          # Check both snapshots before trusting even the previous validator.
          python -I - <<'PYTHON'
          import hashlib, json, os, re, sys
          from pathlib import Path
          files = (
              'validate.py', 'requirements.txt', 'requirements.lock',
              'schemas/core-policy.schema.json', 'schemas/project.schema.json',
              'schemas/task-packet.schema.json', 'schemas/review-evidence.schema.json',
              'schemas/requirement.schema.json',
          )
          def regular(root, name):
              bundle = root / '.engineering-backbone'
              path = bundle / name
              if any(part.is_symlink() for part in (root, bundle, path.parent, path)) or not path.is_file():
                  raise ValueError('Absent or symlinked managed file: ' + name)
              return path
          def digest(root):
              hashes = {name: hashlib.sha256(regular(root, name).read_bytes()).hexdigest() for name in files}
              canonical = json.dumps({'format': 'engineering-backbone-toolchain-v1', 'files': hashes}, sort_keys=True, separators=(',', ':')).encode()
              return hashlib.sha256(canonical).hexdigest()
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('Duplicate project JSON key: ' + key)
                  result[key] = value
              return result
          def agents(root):
              data = json.loads(regular(root, 'project.json').read_text(encoding='utf-8'), object_pairs_hook=unique)
              selected = data.get('agents') if isinstance(data, dict) else None
              if not isinstance(selected, dict) or set(selected) != {'codex', 'copilot'} or any(type(value) is not bool for value in selected.values()):
                  raise ValueError('Trusted and candidate agent selections require exact boolean codex/copilot facts')
              return selected
          try:
              current = os.environ['CURRENT_TOOLCHAIN_SHA256']
              previous = json.loads(os.environ['PREVIOUS_TOOLCHAIN_SHA256'])
              if not re.fullmatch('[0-9a-f]{64}', current) or not isinstance(previous, list) or any(not isinstance(value, str) or not re.fullmatch('[0-9a-f]{64}', value) for value in previous) or len(set(previous + [current])) != len(previous) + 1:
                  raise ValueError('Invalid workflow-owned toolchain fingerprint authority')
              workspace = Path(os.environ['GITHUB_WORKSPACE'])
              base, candidate = workspace / 'trusted-base', workspace / 'candidate'
              for root in (base, candidate):
                  regular(root, 'core.json')
                  regular(root, 'core.md')
              base_digest, candidate_digest = digest(base), digest(candidate)
              if base_digest not in [current] + previous:
                  raise ValueError('Trusted base toolchain fingerprint is not approved by this pinned workflow')
              if candidate_digest not in {base_digest, current}:
                  raise ValueError('Candidate toolchain fingerprint must equal the approved base or current coherent tooling')
              before, after = agents(base), agents(candidate)
              for provider in before:
                  if before[provider] and not after[provider]:
                      raise ValueError('Candidate cannot disable trusted-base agent: ' + provider)
          except (OSError, ValueError, KeyError) as exc:
              print('::error::' + str(exc), file=sys.stderr)
              sys.exit(1)
          PYTHON
          # Never import from, install dependencies from, or execute the candidate.
          cd "$trusted_root"
          python -I -m pip install --require-hashes -r .engineering-backbone/requirements.lock
          python -I "$trusted_root/.engineering-backbone/validate.py" \
            --root "$candidate_root" --trusted-base "$trusted_root"
      - name: Check committed patch whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/candidate"
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::A full candidate commit SHA is required.'
            exit 1
          fi
          git cat-file -e "$HEAD_SHA^{commit}"
          case "$EVENT_NAME" in
            pull_request)
              if [[ ! "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ || "$BASE_SHA" == '0000000000000000000000000000000000000000' ]]; then
                echo '::error::A full PR base commit SHA is required.'
                exit 1
              fi
              git cat-file -e "$BASE_SHA^{commit}"
              ;;
            push)
              if [[ "$BASE_SHA" == '0000000000000000000000000000000000000000' ]]; then
                BASE_SHA="$(git hash-object -t tree /dev/null)"
              elif [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
                git cat-file -e "$BASE_SHA^{commit}"
              else
                echo '::error::A full prior push commit SHA is required.'
                exit 1
              fi
              ;;
            workflow_dispatch)
              # Manual revalidation checks the selected commit's latest patch.
              BASE_SHA="$(git rev-parse --verify "$HEAD_SHA^" 2>/dev/null || git hash-object -t tree /dev/null)"
              ;;
            *)
              echo '::error::Unsupported event for committed-patch validation.'
              exit 1
              ;;
          esac
          git diff --check "$BASE_SHA" "$HEAD_SHA"
